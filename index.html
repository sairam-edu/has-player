<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HLS Video Player</title>
  <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
  <style>
    :root {
      --bg: #f8fafc;
      --surface: #ffffff;
      --text: #1e293b;
      --muted: #64748b;
      --accent: #0ea5e9;
      --border: #e2e8f0;
      --plyr-color-main: var(--accent);
    }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Inter", sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      padding: 40px 20px;
    }
    .container { width: 100%; max-width: 850px; }
    .card {
      background: var(--surface);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1);
      border: 1px solid var(--border);
    }
    .header { margin-bottom: 24px; }
    h1 { margin: 0; font-size: 24px; font-weight: 700; }
    p { margin: 4px 0 0; color: var(--muted); font-size: 14px; }
    .input-group { display: flex; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
    input {
      flex: 1;
      min-width: 300px;
      padding: 12px 16px;
      border-radius: 10px;
      border: 1px solid var(--border);
      font-size: 14px;
      transition: all 0.2s;
    }
    input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(14, 165, 233, 0.2);
    }
    button {
      padding: 12px 24px;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 10px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.1s, opacity 0.2s;
    }
    button:active { transform: scale(0.98); }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    .video-wrapper {
      border-radius: 12px;
      overflow: hidden;
      background: #000;
      aspect-ratio: 16 / 9;
    }
    .status-bar {
      margin-top: 16px;
      padding: 12px;
      background: #f1f5f9;
      border-radius: 8px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 12px;
      color: var(--muted);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="card">
    <div class="header">
      <h1>Pro HLS Player</h1>
      <p>Adaptive Streaming with Memory Leak Protection</p>
    </div>

    <div class="input-group">
      <input id="manifestUrl" type="text" placeholder="Paste .m3u8 URL here..." value="https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8" />
      <button id="loadButton">Load Stream</button>
    </div>

    <div class="video-wrapper">
      <video id="video" crossorigin playsinline></video>
    </div>

    <div class="status-bar">
      <span id="status-text">Ready to stream</span>
      <span id="quality-info" style="font-weight: 600; color: var(--accent);"></span>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.18/dist/hls.min.js"></script>
<script src="https://cdn.plyr.io/3.7.8/plyr.js"></script>

<script>
  const UI = {
    input: document.getElementById("manifestUrl"),
    btn: document.getElementById("loadButton"),
    video: document.getElementById("video"),
    status: document.getElementById("status-text"),
    quality: document.getElementById("quality-info")
  };

  let hls = null;
  let player = null;
  let loadTimeout = null; // Track timeout for cleanup

  function updateStatus(msg, isError = false) {
    UI.status.textContent = msg;
    UI.status.style.color = isError ? "#ef4444" : "";
  }

  function syncAutoLabel(height) {
    if (!player || !hls) return;
    const isAuto = hls.autoLevelEnabled;
    const label = (isAuto && height) ? `Auto (${height}p)` : 'Auto';
    const autoOption = document.querySelector('.plyr__control[data-plyr="quality"][value="0"] span');
    if (autoOption) autoOption.textContent = label;
    if (isAuto) {
      const currentValDisplay = document.querySelector('.plyr__control--forward[data-plyr="quality"] .plyr__menu__value');
      if (currentValDisplay) currentValDisplay.textContent = label;
    }
  }

  function destroyCurrent() {
    // 1. Clear any pending UI state timeouts
    if (loadTimeout) {
      clearTimeout(loadTimeout);
      loadTimeout = null;
    }

    // 2. Destroy Plyr (automatically removes its own listeners)
    if (player) {
      player.destroy();
      player = null;
    }

    // 3. Destroy Hls.js
    if (hls) {
      hls.detachMedia(); // Detach from video element first
      hls.stopLoad();    // Stop any active fragment downloads
      hls.destroy();
      hls = null;
    }

    // 4. Reset video element and wipe inline event handlers
    UI.video.pause();
    UI.video.src = "";
    UI.video.load();
    UI.video.removeAttribute("src");
    UI.video.onloadedmetadata = null;
    UI.video.onerror = null;

    updateStatus("Resetting player...");
  }

  function setupHls(url) {
    hls = new Hls({
      enableWorker: true,
      lowLatencyMode: true,
      backBufferLength: 90
    });

    hls.loadSource(url);
    hls.attachMedia(UI.video);

    hls.on(Hls.Events.MANIFEST_PARSED, (event, data) => {
      const levels = hls.levels.map(l => l.height);
      
      player = new Plyr(UI.video, {
        controls: ['play-large', 'play', 'progress', 'current-time', 'mute', 'volume', 'settings', 'pip', 'fullscreen'],
        settings: ['quality', 'speed'],
        quality: {
          default: 0,
          options: [0, ...levels],
          forced: true,
          onChange: (newQual) => {
            const val = Number(newQual);
            if (val === 0) {
              hls.currentLevel = -1;
              updateStatus("Quality: Auto Mode");
            } else {
              hls.currentLevel = hls.levels.findIndex(l => l.height === val);
              updateStatus(`Quality: Locked ${val}p`);
            }
            syncAutoLabel(null);
          }
        },
        i18n: { qualityLabel: { 0: 'Auto' } }
      });

      updateStatus(`Manifest loaded. ${levels.length} quality levels found.`);
      UI.video.play().catch(() => updateStatus("Autoplay blocked. Tap play."));
    });

    hls.on(Hls.Events.LEVEL_SWITCHED, (event, data) => {
      const level = hls.levels[data.level];
      if (level) {
        UI.quality.textContent = `${level.width}x${level.height}`;
        syncAutoLabel(level.height);
      }
    });

    hls.on(Hls.Events.ERROR, (event, data) => {
      if (data.fatal) {
        if (data.type === Hls.ErrorTypes.NETWORK_ERROR) {
          hls.startLoad();
        } else if (data.type === Hls.ErrorTypes.MEDIA_ERROR) {
          hls.recoverMediaError();
        } else {
          destroyCurrent();
          updateStatus("Fatal error. Reloading required.", true);
        }
      }
    });
  }

  function handleLoad() {
    const url = UI.input.value.trim();
    if (!url) return updateStatus("Invalid URL", true);

    UI.btn.disabled = true;
    destroyCurrent();

    const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || 
                  (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    const nativeHls = UI.video.canPlayType('application/vnd.apple.mpegurl');

    if (Hls.isSupported() && !isIOS) {
      setupHls(url);
    } else if (nativeHls) {
      UI.video.src = url;
      player = new Plyr(UI.video, { controls: ['play-large', 'play', 'progress', 'current-time', 'mute', 'volume', 'fullscreen'] });
      updateStatus("Native Safari Mode");
    } else {
      updateStatus("HLS Not Supported", true);
    }

    // Stored in a variable so destroyCurrent() can clear it if needed
    loadTimeout = setTimeout(() => { 
      UI.btn.disabled = false; 
      loadTimeout = null; 
    }, 600);
  }

  UI.btn.addEventListener("click", handleLoad);

  const startSrc = new URLSearchParams(window.location.search).get('src');
  if (startSrc) { UI.input.value = startSrc; handleLoad(); }
</script>

</body>
</html>
