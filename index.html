<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HLS Video Player</title>
  <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
  <style>
    :root {
      --bg: #f8fafc;
      --surface: #ffffff;
      --text: #1e293b;
      --muted: #64748b;
      --accent: #0ea5e9;
      --border: #e2e8f0;
      --plyr-color-main: var(--accent);
    }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Inter", sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      padding: 40px 20px;
    }
    .container { width: 100%; max-width: 850px; }
    .card {
      background: var(--surface);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1);
      border: 1px solid var(--border);
    }
    .header { margin-bottom: 24px; }
    h1 { margin: 0; font-size: 24px; font-weight: 700; }
    p { margin: 4px 0 0; color: var(--muted); font-size: 14px; }
    .input-group { display: flex; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
    input {
      flex: 1; min-width: 300px; padding: 12px 16px; border-radius: 10px;
      border: 1px solid var(--border); font-size: 14px; transition: all 0.2s;
    }
    input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(14, 165, 233, 0.2); }
    button {
      padding: 12px 24px; background: var(--accent); color: white; border: none;
      border-radius: 10px; font-weight: 600; cursor: pointer; transition: transform 0.1s;
    }
    button:disabled { opacity: 0.6; cursor: not-allowed; }

    .video-wrapper {
      position: relative;
      border-radius: 12px;
      overflow: hidden;
      background: #000;
      aspect-ratio: 16 / 9;
    }
    /* Fixed Loader Z-Index */
    .loader-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.8);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 5; /* Sit above video but below Plyr UI if needed */
      color: white;
      backdrop-filter: blur(8px);
    }
    .loader-overlay.active { display: flex; }

    .status-bar {
      margin-top: 16px; padding: 12px; background: #f1f5f9; border-radius: 8px;
      font-family: monospace; font-size: 12px; color: var(--muted); 
      display: flex; justify-content: space-between;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="card">
    <div class="header">
      <h1>Pro HLS Player</h1>
      <p>Clean Lifecycle Management</p>
    </div>

    <div class="input-group">
      <input id="manifestUrl" type="text" value="https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8" />
      <button id="loadButton">Load Stream</button>
    </div>

    <div class="video-wrapper">
      <div id="loader" class="loader-overlay">Initializing Stream...</div>
      <video id="video" crossorigin playsinline></video>
    </div>

    <div class="status-bar">
      <span id="status-text">Ready</span>
      <span id="quality-info" style="color: var(--accent); font-weight: bold;"></span>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.18/dist/hls.min.js"></script>
<script src="https://cdn.plyr.io/3.7.8/plyr.js"></script>

<script>
  let hls = null;
  let player = null;
  let loadTimeout = null;

  const UI = {
    input: document.getElementById("manifestUrl"),
    btn: document.getElementById("loadButton"),
    status: document.getElementById("status-text"),
    quality: document.getElementById("quality-info"),
    loader: document.getElementById("loader")
  };

  function updateStatus(msg, isError = false) {
    UI.status.textContent = msg;
    UI.status.style.color = isError ? "#ef4444" : "";
  }

  function setLoader(active) {
    active ? UI.loader.classList.add('active') : UI.loader.classList.remove('active');
  }

  function destroyCurrent() {
    if (loadTimeout) { clearTimeout(loadTimeout); loadTimeout = null; }
    
    if (hls) {
      hls.detachMedia();
      hls.stopLoad();
      hls.destroy();
      hls = null;
    }

    if (player) {
      player.destroy();
      player = null;
    }

    // Crucial: Get the video element fresh after Plyr might have modified the DOM
    const videoElem = document.getElementById("video");
    if (videoElem) {
      videoElem.pause();
      videoElem.src = "";
      videoElem.load();
      videoElem.removeAttribute("src");
      videoElem.onplaying = null;
    }
    
    updateStatus("Cleaning sessions...");
  }

  function setupHls(url, videoElem) {
    hls = new Hls({ enableWorker: true, lowLatencyMode: true });
    hls.loadSource(url);
    hls.attachMedia(videoElem);

    hls.on(Hls.Events.MANIFEST_PARSED, (event, data) => {
      const levels = hls.levels.map(l => l.height);
      
      player = new Plyr(videoElem, {
        settings: ['quality', 'speed'],
        quality: {
          default: 0,
          options: [0, ...levels],
          forced: true,
          onChange: (newQual) => {
            const val = Number(newQual);
            hls.currentLevel = (val === 0) ? -1 : hls.levels.findIndex(l => l.height === val);
          }
        }
      });

      updateStatus(`Streaming: ${levels.length} quality levels`);
      
      // DISMISS LOADER ONLY WHEN VIDEO ACTUALLY STARTS SHOWING FRAMES
      videoElem.onplaying = () => {
        setLoader(false);
        updateStatus("Playback active");
      };

      videoElem.play().catch(() => {
        setLoader(false); // Dismiss if autoplay fails so user can click play
        updateStatus("Click Play to start");
      });
    });

    hls.on(Hls.Events.LEVEL_SWITCHED, (event, data) => {
      const level = hls.levels[data.level];
      if (level) UI.quality.textContent = `${level.height}p`;
    });

    hls.on(Hls.Events.ERROR, (event, data) => {
      if (data.fatal) {
        setLoader(false);
        updateStatus("Stream Error", true);
        destroyCurrent();
      }
    });
  }

  function handleLoad() {
    const url = UI.input.value.trim();
    if (!url) return;

    UI.btn.disabled = true;
    setLoader(true);
    destroyCurrent();

    // Re-query the video element after destruction
    const videoElem = document.getElementById("video");

    const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || 
                  (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

    if (Hls.isSupported() && !isIOS) {
      setupHls(url, videoElem);
    } else if (videoElem.canPlayType('application/vnd.apple.mpegurl')) {
      videoElem.src = url;
      player = new Plyr(videoElem);
      videoElem.onplaying = () => setLoader(false);
      videoElem.play();
    }

    loadTimeout = setTimeout(() => { UI.btn.disabled = false; }, 1000);
  }

  UI.btn.addEventListener("click", handleLoad);
</script>

</body>
</html>
